# Terminal Dreams swarm stack.
#
# Two services on the existing platform-01 dokploy-network:
#   - terminal-dreams:    Next.js app (port 3000 internal, behind Traefik)
#   - pocketbase:         PocketBase (port 8090 internal, no Traefik route)
#
# Build steps run on the host (see infra/deploy.sh). Images are tagged
# locally; we don't push to a registry yet.
#
# Public hostnames are proxied through Cloudflare. Traefik uses DNS-01 for
# certificates and the shared hsts@file middleware.
# NOT SSO-gated -- this is a public-facing portfolio app.

version: "3.9"

services:
  pocketbase:
    image: terminal-dreams-pocketbase:${IMAGE_TAG:-local}
    networks:
      - dokploy-network
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - TZ=UTC
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
      # No traefik labels -- PB stays internal-only. The Next app reaches it
      # via http://pocketbase:8090 on dokploy-network.

  app:
    image: terminal-dreams-app:${IMAGE_TAG:-local}
    networks:
      - dokploy-network
    environment:
      - NODE_ENV=production
      - POCKETBASE_URL=http://pocketbase:8090
      # POCKETBASE_ADMIN_EMAIL / POCKETBASE_ADMIN_PASSWORD / SESSION_SECRET are
      # injected from /opt/apps/terminal-dreams/secrets/app.env at deploy time
      # via `docker stack deploy`'s --with-env. We don't bake them into the
      # image; see infra/deploy.sh.
      - POCKETBASE_ADMIN_EMAIL
      - POCKETBASE_ADMIN_PASSWORD
      - SESSION_SECRET
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=dokploy-network
        - traefik.http.routers.terminal-dreams.rule=Host(`dprophecyguy.com`) || Host(`www.dprophecyguy.com`) || Host(`terminal-dreams.unlocalhosted.com`)
        - traefik.http.routers.terminal-dreams.entrypoints=websecure
        - traefik.http.routers.terminal-dreams.tls.certresolver=letsencrypt
        - traefik.http.routers.terminal-dreams.middlewares=hsts@file
        - traefik.http.services.terminal-dreams.loadbalancer.server.port=3000

volumes:
  pb_data:

networks:
  dokploy-network:
    external: true
